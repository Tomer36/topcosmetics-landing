name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two FTP uploads at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check translations
        run: npm run check:i18n

      - name: Build
        run: npm run build
        env:
          # Optional repository variable. Empty = no analytics, no cookies.
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}

      - name: Check languages on the built pages
        run: npm run check:site

      - name: Upload dist/ to Hostinger by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          # Must end with "/". See README → "Which folder does FTP upload to?"
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
